dataset:
  name: nuscenes
  data_root: data/nuscenes/
  ann_file: data/nuscenes/nuscenes_infos_val.pkl
  scene_id: null
  start_frame: 0

image:
  final_dim: [384, 1056]
  stride: 32

pe:
  position_range: [-15.0, -30.0, -2.0, 15.0, 30.0, 2.0]
  depth_start: 1.0
  depth_num: 64
  lid: true
  embed_dims: 512
  checkpoint_path: null
  allow_untrained_mlp: false
  device: cpu

sample:
  mode: mode_ray
  frame_offsets: [-2, -1, 0, 1, 2]
  camera_index: 0
  ray:
    camera_index: 0
    pixel_uv: [528.0, 192.0]

perturbed: false
perturb_ego_se2:
  dx: 0.0
  dy: 0.0
  dyaw_deg: 0.0

output:
  data_dir: experiments/exp_a_petr_pe_viz/outputs/data
